
services:

  # =========================
  # ZOOKEEPER
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    restart: unless-stopped
    mem_limit: 128m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms32m -Xmx64m"
    ports:
      - "2181:2181"
    networks:
      - ecom-network

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # JVM Heap Configuration
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

      # Log Cleaner Memory Optimization
      KAFKA_LOG_CLEANER_THREADS: 1
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - ecom-network

  # =========================
  # REDIS
  # =========================
  product-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 80m
    command:
      - redis-server
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cartnexa_redis_data:/data
    networks:
      - ecom-network

  # =========================
  # USER DATABASE
  # =========================
  user-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${USER_DB_PASSWORD}
      MYSQL_DATABASE: ecomuserdb
    ports:
      - "3315:3306"
    volumes:
      - cartnexa_user_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # =========================
  # PRODUCT DATABASE
  # =========================
  product-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${PRODUCT_DB_PASSWORD}
      MYSQL_DATABASE: ecomproductdb
    ports:
      - "3308:3306"
    volumes:
      - cartnexa_product_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # =========================
  # INVENTORY DATABASE
  # =========================
  inventory-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${INVENTORY_DB_PASSWORD}
      MYSQL_DATABASE: ecominventorydb
    ports:
      - "3307:3306"
    volumes:
      - cartnexa_inventory_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # =========================
  # CART DATABASE
  # =========================
  cart-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${CART_DB_PASSWORD}
      MYSQL_DATABASE: ecomcartdb
    ports:
      - "3311:3306"
    volumes:
      - cartnexa_cart_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # =========================
  # ORDER DATABASE
  # =========================
  order-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_PASSWORD}
      MYSQL_DATABASE: ecomorderdb
    ports:
      - "3312:3306"
    volumes:
      - cartnexa_order_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # =========================
  # PAYMENT DATABASE
  # =========================
  payment-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${PAYMENT_DB_PASSWORD}
      MYSQL_DATABASE: ecompaymentdb
    ports:
      - "3313:3306"
    volumes:
      - cartnexa_payment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # =========================
  # NOTIFICATION DATABASE
  # =========================
  notification-db:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ecomnotificationdb
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "3314:3306"
    volumes:
      - cartnexa_notification_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecom-network

  # =========================
  # EUREKA SERVER
  # =========================
  eureka-server:
    build:
      context: ./10_Ecom_Eureka_service
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ecom-network

  # =========================
  # USER SERVICE
  # =========================
  user-service:
    build:
      context: ./02_Ecom_UserService
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8082:8082"
    environment:
      DB_HOST: user-db
      DB_USERNAME: root
      DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # PRODUCT SERVICE
  # =========================
  product-service:
    build:
      context: ./03_Ecom_Product_Service
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8083:8083"
    environment:
      DB_HOST: product-db
      DB_USERNAME: root
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: product-redis
      REDIS_PORT: 6379
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      product-db:
        condition: service_healthy
      product-redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # INVENTORY SERVICE
  # =========================
  inventory-service:
    build:
      context: ./04_Ecom_Inventory_Service
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8084:8084"
    environment:
      DB_HOST: inventory-db
      DB_USERNAME: root
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # CART SERVICE
  # =========================
  cart-service:
    build:
      context: ./05_Ecom_Cart_Service
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8085:8085"
    environment:
      DB_HOST: cart-db
      DB_USERNAME: root
      DB_PASSWORD: ${CART_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      cart-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # ORDER SERVICE
  # =========================
  order-service:
    build:
      context: ./06_Ecom_Order_Service
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8086:8086"
    environment:
      DB_HOST: order-db
      DB_USERNAME: root
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # PAYMENT SERVICE
  # =========================
  payment-service:
    build:
      context: ./07_Ecom_payment_Service
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8087:8087"
    environment:
      DB_HOST: payment-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    build:
      context: ./08_Ecom_Notification_service
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8088:8088"
    environment:
      DB_HOST: notification-db
      DB_USERNAME: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    build:
      context: ./01_Ecom-Api-Gateway
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8081:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - ecom-network

  # =========================
  # FRONTEND
  # =========================
  frontend:
    build:
      context: ./09_Ecom_FrontEnd_service
    restart: unless-stopped
    mem_limit: 80m
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
    networks:
      - ecom-network

# =========================
# NETWORKS
# =========================
networks:
  ecom-network:
    name: cartnexa-network
    driver: bridge

# =========================
# PERSISTENT VOLUMES
# =========================
volumes:
  kafka-data:
  cartnexa_redis_data:
  cartnexa_user_data:
  cartnexa_product_data:
  cartnexa_inventory_data:
  cartnexa_cart_data:
  cartnexa_order_data:
  cartnexa_payment_data:
  cartnexa_notification_data:

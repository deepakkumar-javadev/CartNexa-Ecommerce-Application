server:
  port: 8085

spring:
  application:
    name: ECOM-CART-SERVICE

  datasource:
    url: jdbc:mysql://${DB_HOST:host.docker.internal}:3306/ecomcartdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://host.docker.internal:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: ECOM-CART-SERVICE
    description: Ecommerce Cart Service
    version: 1.0.0
jwt:
  secret: ${JWT_SECRET}

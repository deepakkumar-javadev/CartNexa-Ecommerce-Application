server:
  port: 8083

spring:
  application:
    name: ECOM-PRODUCT-SERVICE

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ecomproductdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ECOM-PRODUCT-SERVICE
    description: Ecommerce Product Microservice
    version: 1.0.0
jwt:
  secret: ${JWT_SECRET}
